# Memory map and segments of the stock firmware.
# Read by tools/ghidra/build_project.py. Addresses are absolute.

[firmware]
path = "baserom/firmware.bin"
base = 0x08000000
language = "ARM:LE:32:Cortex"
compiler = "default"

[svd]
path = "build/svd/AT32F415xx_v2.svd"
url = "https://raw.githubusercontent.com/ArteryTek/sdk-csp-at32f4/535245f3b5155c18a4998cc7b1a33478604828a9/debug/svd/AT32F415xx_v2.svd"
sha256 = "28accc92eba89f9e7fc2374dcfc0722f9db00e74928ad620a6f0af8e7438c1e2"

# Segments of the flash image. Each one becomes a Ghidra memory block
# initialised from the firmware bytes. Only executable ("x") segments are
# disassembled. Documented in docs/firmware-image.md.
[[segment]]
name = "bootloader"
start = 0x08000000
end = 0x08005000
perms = "rx"
vectors = 0x08000000
suffix = "_BL"

[[segment]]
name = "bootloader_copy"
start = 0x08005000
end = 0x0800A000
perms = "r"
note = "Bootloader update payload: main copies it over the bootloader when their last bytes differ."

[[segment]]
name = "app"
start = 0x0800A000
end = 0x08025D4C
perms = "rx"
vectors = 0x0800A000
suffix = ""

[[segment]]
name = "free"
start = 0x08025D4C
end = 0x0802E000
perms = "r"
note = "Zero padding after the application: the space for patches (about 33 KB)."

[[segment]]
name = "app_marker"
start = 0x0802E000
end = 0x0802F000
perms = "r"
note = "Zero padding holding the application-present marker at 0x0802E7FE-0x0802E7FF (bootloader checks they are not 0xFF). Do not use."

[[segment]]
name = "user_programs"
start = 0x0802F000
end = 0x08037000
perms = "r"
note = "User programs: zeros in the update image; the application erases and writes the defaults at first boot when the data is not valid."

[[segment]]
name = "storage"
start = 0x08037000
end = 0x0803F800
perms = "r"
note = "Nine 4 KB blocks with 0x14B bytes of data each (factory presets?)."

[[segment]]
name = "config"
start = 0x0803F800
end = 0x08040000
perms = "r"
note = "Configuration sector: serial, calibration at 0x0803F820, trailer at 0x0803FFF0 (VID/PID, layout, version). Preserved by the bootloader on updates."

# Uninitialised memory. Peripherals come from the SVD.
[[memory]]
name = "ram"
start = 0x20000000
size = 0x8000
perms = "rw"
