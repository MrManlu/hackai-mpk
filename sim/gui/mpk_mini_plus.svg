<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440">
  <!-- AKAI MPK Mini Plus panel for the hackai-mpk simulator.
       Drawn for this project (not a photo). Every control has an id that
       sim/gui/mpk_mini_plus.toml connects to the simulator. -->
  <defs>
    <style>
      .label { font: 600 8px sans-serif; fill: #d8d8d8; text-anchor: middle; }
      .small { font: 7px sans-serif; fill: #9a9a9a; text-anchor: middle; }
      .btn { fill: #3a3a3e; stroke: #111; stroke-width: 1; }
      .pad { fill: #1c1c1e; stroke: #555; stroke-width: 2; }
      .knob { fill: #1a1a1a; stroke: #444; stroke-width: 2; }
      .white { fill: #f4f4f2; stroke: #222; stroke-width: 1; }
      .black { fill: #151515; stroke: #000; stroke-width: 1; }
    </style>
  </defs>
