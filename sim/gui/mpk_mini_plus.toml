# Connects the controls of mpk_mini_plus.svg to the simulator.
#
# Everything marked "guess" is unconfirmed: fix it here when you find out
# (the LED outputs and key matrix panels in the GUI are made for that).

[oled]
id = "oled"
width = 128
height = 32
color = "#e8f0ff"

# 8 RGB pads. LED outputs of the shift-register chain (docs/leds.md):
# pad n uses outputs 24 + 3*(n-1) + offset.
[pads]
first_output = 24
# Offset of the red, green and blue channel inside each triplet.
# Red = 2: all pads red at power-up with program 1 ("MPC"), real unit.
# Green = 1: program 5 ("GarageBand") makes the pads green on the real unit;
# in the simulator it lights them at [12, 62, 16] % (channel 1 dominant).
# Blue = 0: program 1 pads turn blue when hit on the real unit (channel 0).
rgb_offsets = [2, 1, 0]
# Which triplet (0-7) lights each pad, pad1..pad8. Reversed: in PROG SELECT
# mode the real unit lights PAD 1 and the firmware lights the last triplet
# (outputs 45-47). Only PAD 1 is confirmed; the rest assume the same order.
triplet = [7, 6, 5, 4, 3, 2, 1, 0]

# Buttons with a LED. `led` is the output of the shift-register chain, or a
# table of outputs per colour for multi-colour LEDs ({ red = 21, green = 22 }),
# `modifier = true` makes a latched button (right click) release itself after
# the next press of another button (sticky SHIFT),
# `matrix` is [row, column] in the key matrix (row 0-12 selected through a
# decoder on PC0-PC3, columns PC8-PC15). Found with `make matrix-sweep`:
#   confirmed  = the screen names the function (Arp Setup, Note Repeat, Load
#                Program) or the behaviour is unambiguous
#   order      = follows the button order on the panel; behaviour fits
#   guess      = by elimination
# Rows 10-12 hold the 18 buttons; rows 0-9 show no visible effect (keybed?).
[buttons]
btn_arp = { matrix = [10, 0], led = 54 }          # confirmed: "Arp Setup", LED on after release
btn_tap_tempo = { matrix = [10, 1], led = 53 }    # order (no visible effect on a single press); LED 53 blinks: guess
btn_note_repeat = { matrix = [10, 2], led = 52 }  # confirmed: "Note Repeat"
btn_full_level = { matrix = [10, 3], led = 50 }   # order: LED toggles
btn_oct_down = { matrix = [10, 4], led = 49 }     # order: LED lit after press
btn_oct_up = { matrix = [10, 5], led = 48 }       # order: LED lit after press
btn_bank = { matrix = [11, 0], led = { red = 21, green = 22 } }  # confirmed on the real unit: red = bank A, green = bank B
btn_scales = { matrix = [11, 1], led = 19 }       # order: LED toggles
btn_chords = { matrix = [11, 2], led = 17 }       # order: LED toggles
btn_shift = { matrix = [11, 3], led = 14, modifier = true }        # confirmed: LED lit only while held
btn_home = { matrix = [11, 4], led = 12 }         # order (no change on the home screen); LED by elimination
btn_prog_select = { matrix = [11, 5], led = 10 }  # confirmed: "Load Program / Press a pad"
btn_rewind = { matrix = [12, 0] }                 # order; LED one of 2-6
btn_forward = { matrix = [12, 1] }                # order; LED one of 2-6
btn_stop = { matrix = [12, 2] }                   # order; LED one of 2-6
btn_play = { matrix = [12, 3] }                   # order; LED one of 2-6
btn_rec = { matrix = [12, 4] }                    # order; LED one of 2-6
btn_seq = { matrix = [12, 5], led = 1 }           # order: LED toggles

[matrix]
rows = 13
columns = 8

# Analog inputs: [ADC channel, multiplexer position]. Found with
# `make analog-sweep` (the firmware names each control on the OLED).
# Channels 0 and 1 use a dual 4:1 multiplexer (only select lines S0-S1), so a
# pad is read at two positions (n and n + 4): both are driven.
[analog.pads]
pressure = 3500          # value while a pad is held
pad1 = [[0, 3], [0, 7]]
pad2 = [[0, 1], [0, 5]]
pad3 = [[0, 2], [0, 6]]
pad4 = [[0, 0], [0, 4]]
pad5 = [[1, 0], [1, 4]]
pad6 = [[1, 3], [1, 7]]
pad7 = [[1, 2], [1, 6]]
pad8 = [[1, 1], [1, 5]]

# Endless knobs ("Q-LINK"): two wipers, triangle waves 90 degrees apart.
# Clockwise (value up) when wiper b lags wiper a by 90 degrees.
[analog.knobs]
knob1 = { a = [4, 0], b = [3, 0] }
knob2 = { a = [4, 1], b = [3, 1] }
knob3 = { a = [4, 2], b = [3, 2] }
knob4 = { a = [4, 3], b = [3, 3] }
knob5 = { a = [4, 4], b = [3, 4] }
knob6 = { a = [4, 5], b = [3, 5] }
knob7 = { a = [4, 6], b = [3, 6] }
knob8 = { a = [4, 7], b = [3, 7] }

# Wheels and joystick: channel 2, scaled by the firmware with the calibration
# limits stored in flash (min/max below, as read from the firmware's table).
[analog.wheels]
pitch_wheel = { input = [2, 1], min = 100, max = 3095, rest = 1597, spring = true }  # "PITCH"
mod_wheel = { input = [2, 0], min = 100, max = 3095, rest = 100 }                    # "Modulation"

[analog.joystick]
id = "joystick"
x = [2, 2]               # "JOYSTICK"; which axis is X: guess
y = [2, 3]
min = 110
max = 3583
rest = 1846
radius = 30              # drag distance (panel units) for full deflection

# Encoder (PUSH TO ENTER): quadrature on PC4/PC5 (`encoder Turn n`), push in
# the key matrix at row 11, column 6 (PC14). Found by turning it in the
# "Load Program" screen and pressing the PC14/PC15 positions.
[encoder]
id = "encoder"
push = [11, 6]
